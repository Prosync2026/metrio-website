# Builds the site and deploys it to GitHub Pages on every push to main.
# Works at both addresses: configure-pages reports base_path "" when a custom
# domain is set (site at /) and "/metrio-website" otherwise.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_CARTO_API_KEY: ${{ secrets.VITE_CARTO_API_KEY }}

      # Render every route to static HTML (dist/about-us.html etc.) so pages
      # return 200 with real content and meta; also writes sitemap.xml,
      # robots.txt and a noindex 404.html shell for unknown URLs.
      - run: npx puppeteer browsers install chrome
      - run: npm run prerender
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
